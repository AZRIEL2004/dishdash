name: dishdash
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  firebase_core: ^3.10.1
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.3.0
  firebase_database: ^11.1.0
  provider: ^6.0.5
  image_picker: ^1.1.2
  google_sign_in: ^6.2.1
  google_generative_ai: ^0.4.7
  http: ^1.1.0
  share_plus: ^10.1.0
  video_player: ^2.9.2
  chewie: ^1.8.5
  youtube_player_flutter: ^9.1.1
  table_calendar: ^3.1.2
  intl: ^0.20.2
  flutter_tts: ^4.2.2
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
